[package]
name = "driftkit"
version = "0.1.0"
edition = "2021"
description = "Finds where a project's declarations and its behaviour disagree"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustpython-parser = "0.4.0"

[profile.release]
strip = true
opt-level = "z"
lto = true
